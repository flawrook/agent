# deb and rpm for one architecture; scripts/release.sh sets VERSION, GOARCH and MAINTAINER.
name: flawrook-agent
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: ${MAINTAINER}
description: |
  FlawRook agent: reports this server's OS packages and runtimes to FlawRook every hour.
  Outbound HTTPS only, no port opened, no remote commands, read-only everywhere.
homepage: https://github.com/flawrook/agent
license: Apache-2.0
contents:
  - src: dist/pkg/flawrook-agent # the GOARCH binary, staged by scripts/release.sh
    dst: /usr/bin/flawrook-agent
    file_info:
      mode: 0755
  - src: packaging/flawrook-agent.service
    dst: /usr/lib/systemd/system/flawrook-agent.service
    file_info:
      mode: 0644
  - dst: /etc/flawrook
    type: dir
    file_info:
      mode: 0750
      group: flawrook # created by preinstall: the service reads its config as a member, with no capability
  - src: packaging/agent.yaml
    dst: /etc/flawrook/agent.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      group: flawrook
  - src: LICENSE
    dst: /usr/share/doc/flawrook-agent/LICENSE
  - src: NOTICE
    dst: /usr/share/doc/flawrook-agent/NOTICE
  - src: third_party/licenses
    dst: /usr/share/doc/flawrook-agent/third_party/licenses
    type: tree
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
