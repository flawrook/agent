{{- if not .Values.flawrook.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flawrook-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flawrook-agent.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.flawrook.token | b64enc | quote }}
{{- end }}
