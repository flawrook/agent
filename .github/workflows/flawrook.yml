# FlawRook's own scan of this repository (https://flawrook.dev/docs/ci-api), through the reusable workflow this
# repository publishes (.github/workflows/check.yml), so every pull request here tests it too. The repository is
# connected to FlawRook through GitHub, so FlawRook reads the commit itself, on every push to main (the baseline) and on
# every pull request (a change compared with the baseline). The job fails on a new P1 or P2 finding the change brought
# in; when FlawRook can't be reached it ends with a warning and the workflow goes on. FLAWROOK_TOKEN is a repository
# secret.
name: FlawRook
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flawrook:
    uses: ./.github/workflows/check.yml
    secrets:
      FLAWROOK_TOKEN: ${{ secrets.FLAWROOK_TOKEN }}
